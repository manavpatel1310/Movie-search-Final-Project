<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Styling for the detail page */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
        }

        .movie-poster {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .movie-title {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .movie-overview {
            margin-top: 20px;
            font-size: 1em;
            color: #555;
        }

        .movie-details {
            margin-top: 30px;
        }

        .movie-actions button {
            margin-right: 10px;
        }

        .back-button {
            margin-top: 20px;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.poster_path}" class="movie-poster" alt="Movie Poster">
            </div>
            <div class="col-md-6">
                <h1 class="movie-title" th:text="${movie.title}"></h1>
                <p><strong>Release Date on:</strong> <span th:text="${movie.release_date}"></span></p>
                <p><strong>Rating:</strong> <span th:text="${movie.vote_average}"></span></p>
                <p class="movie-overview" th:text="${movie.overview}"></p>

                <!-- Add to Favorites Button -->
                <div class="movie-actions">
                    <form th:action="@{/favorite/{id}(id=${movie.id})}" method="post">
                        <button type="submit" class="btn btn-success">Add to Favorites</button>
                    </form>
                    <a href="/" class="btn btn-secondary mt-3">Back to List</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
