<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styling for the homepage */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
        }

        .movie-card {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .movie-img {
            width: 100%;
            height: auto;
        }

        .movie-details {
            padding: 15px;
        }

        .movie-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .movie-release-date {
            font-size: 0.9em;
            color: #777;
        }

        .search-bar {
            margin: 20px 0;
        }

        .search-bar input {
            width: 300px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-bar button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Search Movies 🎥</h1>

        <!-- Link to Favorites -->
        <a href="http://localhost:8080/favorites" class="btn btn-primary mb-3">My Favorites</a>

        <!-- Search Form -->
        <div class="search-bar text-center">
            <form action="/search" method="get">
                <input type="text" name="query" placeholder="Search movies" required>
                <button type="submit">Search 🔎</button>
            </form>
        </div>

        <!-- Display Movies -->
        <div class="row">
            <div class="col-md-3 mb-4" th:each="movie : ${movies}">
                <!-- Movie Card -->
                <div class="movie-card">
                    <img th:src="${movie.posterUrl}" class="movie-img" alt="Movie Poster">
                    <div class="movie-details">
                        <h3 class="movie-title" th:text="${movie.title}"></h3>
                        <p class="movie-release-date" th:text="${movie.release_date}"></p>
                        <a th:href="@{/movie/{id}(id=${movie.id})}" class="btn btn-info btn-sm">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
